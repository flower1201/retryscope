name: Bug report
description: Report a RetryScope bug (no private session logs)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real agent session logs.** Redact or use synthetic fixtures.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RetryScope version
      placeholder: 0.1.0-dev.0
  - type: textarea
    id: repro
    attributes:
      label: Minimal synthetic reproduction
      description: Synthetic JSONL snippet or steps only
